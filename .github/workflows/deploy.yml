name: Deploy to Oracle ARM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy + verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET
          script: |
            cd ~/app || { echo "ERROR: ~/app no existe. Clonalo primero: git clone <repo> ~/app"; exit 1; }
            git pull
            printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$POSTGRES_PASSWORD" "$JWT_SECRET" > .env
            docker compose build
            docker compose up -d --force-recreate
            sleep 5
            echo "--- Smoke test ---"
            curl -f http://localhost/health && echo "✓ Health OK"
            curl -f http://localhost/api/health && echo "✓ API Health OK"
            echo "--- Deploy completo ---"
