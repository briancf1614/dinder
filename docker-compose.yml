services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dinder-net

  api:
    build:
      context: .
      dockerfile: src/Dinder.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=dinder;Username=dinder;Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_URLS=http://+:5022
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Secret=${JWT_SECRET}
    networks:
      - dinder-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5022/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Sin "ports:" → interno, solo accesible desde nginx

  health:
    build:
      context: ./src/Dinder.Health
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5001
    networks:
      - dinder-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Sin "ports:" → interno

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - health
    networks:
      - dinder-net

volumes:
  pgdata:

networks:
  dinder-net:
    driver: bridge
